<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กระทงยักษ์ · ASCII Giant Krathong</title>
<style>
:root{color-scheme:dark;--bg:#050414}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#mus{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 8px);font:13px ui-monospace,Menlo,Consolas,monospace;color:#fff;background:linear-gradient(135deg,rgba(255,120,190,.55),rgba(150,100,230,.55));border:1px solid rgba(255,190,230,.7);backdrop-filter:blur(6px);border-radius:999px;padding:7px 14px;cursor:pointer}
#mus:focus-visible{outline:2px solid #ffc45a;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mus" type="button">♪ เปิดเพลง</button>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, fs, cw, lh, cols, rows, ox, wr, S, cy, buf;
const MONO = 'ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace';
const GOLD = [255, 200, 90], PINK = [255, 150, 200], WHITE = [235, 235, 245], ORANGE = [255, 140, 50], CYAN = [110, 220, 255], LILAC = [190, 160, 255];
const rnd = Math.random, P = Math.PI * 2;
const RAMP = ' .:-~=+vxoO%&W#@', SUB = 'L O Y   K R A T H O N G';
const rgb = (c, b = 1, a = 1) => `rgba(${Math.max(0, Math.min(255, c[0] * b)) | 0},${Math.max(0, Math.min(255, c[1] * b)) | 0},${Math.max(0, Math.min(255, c[2] * b)) | 0},${a})`;

// ---------- music: original melody in C major, ranat / music-box style ----------
const SC = { c: 261.63, d: 293.66, e: 329.63, f: 349.23, g: 392, a: 440, b: 493.88 };
const nf = ch => SC[ch.toLowerCase()] * (ch === ch.toLowerCase() ? 1 : 2);
const TUNE = 'e1 g1 C2 b1 C1 D2 C1.5 a.5 f2 g1 a1 b1 g1 e1 g1 E2 D1 C1 b1 a1 a1 C1 a1 f1 g3 r1 g1 e1 c1 e1 g1.5 e.5 g1 C1 a1 C1 D1 C1 b1.5 a.5 g2 a1 C1 E1 D1 C1 a1 f1 a1 d1 f1 g1 b1 C4'.split(' ');
const CHORD = 'CCFGCAFGCCFGAFGC', BASS = { C: [130.81, 196], F: [174.61, 261.63], G: [98, 146.83], A: [110, 164.81] }, MID = { C: 329.63, F: 261.63, G: 293.66, A: 329.63 };
const SPB = 60 / 90, LOOP = 64, EV = [];
{
  let b = 0;
  for (const tk of TUNE) { const d = parseFloat(tk.slice(1)); if (tk[0] !== 'r') EV.push({ b, f: nf(tk[0]), d, v: 0.24, k: 0 }); b += d; }
  for (let i = 0; i < 16; i++) {
    EV.push({ b: i * 4, f: BASS[CHORD[i]][0], d: 2, v: 0.2, k: 1 });
    EV.push({ b: i * 4 + 2, f: BASS[CHORD[i]][1], d: 2, v: 0.12, k: 1 });
    EV.push({ b: i * 4 + 1, f: MID[CHORD[i]], d: 0.5, v: 0.06, k: 0 });
    EV.push({ b: i * 4 + 3, f: MID[CHORD[i]], d: 0.5, v: 0.06, k: 0 });
  }
  const ks = ['c', 'd', 'e', 'g', 'a'];
  for (let i = 1; i < LOOP; i += 2) EV.push({ b: i + 0.5, f: SC[ks[(i * 2 + (i >> 2)) % 5]] * 4, d: 0.5, v: 0.05, k: 0 });
  EV.sort((x, y) => x.b - y.b);
}
let ac, master, playing = false, loopT0 = 0, ei = 0, loopStart = 0;
function tone(f, when, d, v, bass) {
  const g = ac.createGain(), end = when + (bass ? 1.4 : Math.max(d * SPB, 0.4) * 1.8);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(v, when + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, end);
  g.connect(master);
  [['sine', 1, 1], ['triangle', 2, bass ? 0 : 0.35]].forEach(([ty, m, a]) => {
    if (!a) return;
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = ty; o.frequency.value = f * m; og.gain.value = a;
    o.connect(og); og.connect(g); o.start(when); o.stop(end + 0.05);
  });
}
function sched() {
  while (loopStart + EV[ei].b * SPB < ac.currentTime + 0.6) {
    const e = EV[ei];
    tone(e.f, Math.max(loopStart + e.b * SPB, ac.currentTime), e.d, e.v, e.k);
    if (++ei >= EV.length) { ei = 0; loopStart += LOOP * SPB; }
  }
}
function startMusic() {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.6;
  const dl = ac.createDelay(), fb = ac.createGain(), wet = ac.createGain();
  dl.delayTime.value = 0.4; fb.gain.value = 0.38; wet.gain.value = 0.35;
  master.connect(ac.destination); master.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(ac.destination);
  loopStart = loopT0 = ac.currentTime + 0.1;
  setInterval(sched, 100);
}
const mus = document.getElementById('mus');
let userOff = false;
const label = () => { mus.textContent = !ac ? '♪ เปิดเพลง' : ac.state === 'running' ? '♪ ปิดเพลง' : userOff ? '♪ เปิดเพลง' : '♪ แตะเพื่อเริ่มเพลง'; };
mus.addEventListener('click', () => {
  try {
    if (!ac) startMusic();
    if (ac.state === 'running') { ac.suspend(); userOff = true; }
    else { userOff = false; ac.resume(); }
    playing = !userOff;
  } catch (e) { console.error(e); }
  label();
});
// browsers block sound until the first touch/click, so the first tap anywhere starts the music
const unlock = e => { if (e.target === mus || !ac || userOff || ac.state === 'running') return; ac.resume().catch(() => {}); };
['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => addEventListener(ev, unlock, true));
try { startMusic(); ac.onstatechange = label; playing = true; ac.resume().catch(() => {}); } catch (e) { console.error(e); }
label();

// ---------- the giant krathong: 3D point model (y up) ----------
const pts = [];
function tier(n, r0, r1, h0, h1, wd, col, cnt, ph) {   // lotus petal ring
  for (let i = 0; i < n; i++) {
    const a = i / n * P + ph;
    for (let m = 0; m < cnt; m++) {
      const u = Math.pow(rnd(), 0.85), v = rnd() * 2 - 1;
      const wid = wd * Math.pow(Math.sin(Math.PI * Math.min(1, 0.12 + u * 0.9)), 0.8);
      const rr = r0 + (r1 - r0) * u, ang = a + (v * wid) / rr, tip = u * u * u;
      pts.push({
        x: rr * Math.cos(ang), z: rr * Math.sin(ang),
        y: h0 + (h1 - h0) * Math.sin(u * 1.5708) + 0.025 * v * v - 0.01 * u * u,
        c: col.map(q => q + (255 - q) * tip), sh: 0.82 + 0.18 * Math.abs(v), j: rnd(), k: rnd() < 0.06 ? 2 : 0, ph: rnd() * 6.3
      });
    }
  }
}
tier(13, 0.12, 0.46, 0.13, 0.20, 0.115, [255, 205, 225], 130, 0);
tier(11, 0.08, 0.34, 0.17, 0.34, 0.10, [255, 150, 195], 115, 0.3);
tier(9, 0.05, 0.22, 0.20, 0.46, 0.08, [240, 95, 160], 95, 0.1);
tier(7, 0.03, 0.12, 0.22, 0.50, 0.06, [210, 60, 130], 60, 0.5);
for (let i = 0; i < 28; i++) {   // pleated banana leaves
  const a = i / 28 * P, g = i % 2 ? [60, 150, 80] : [110, 195, 110];
  for (let m = 0; m < 55; m++) {
    const v = rnd() * 2 - 1, w = Math.pow(rnd(), 0.8), ang = a + v * 0.1 * (1 - w * 0.6), r = 0.5 + 0.1 * w, l = 0.8 + 0.4 * w;
    pts.push({ x: r * Math.cos(ang), y: 0.09 + w * 0.22 * (1 - v * v), z: r * Math.sin(ang), c: g.map(q => q * l), sh: 1, j: rnd(), k: 0 });
  }
}
for (let i = 0; i < 750; i++) {   // banana-stem disc: side + top rim
  const a = rnd() * P, side = i < 450, r = side ? 0.5 : 0.34 + rnd() * 0.16, ring = 0.9 + 0.1 * Math.sin(r * 90);
  pts.push({ x: r * Math.cos(a), y: side ? rnd() * 0.1 : 0.1, z: r * Math.sin(a), c: [235 * ring, 222 * ring, 165 * ring], sh: side ? 0.85 : 1, j: rnd(), k: 0 });
}
for (let i = 0; i < 28; i++) {   // marigold ring
  const a = (i + 0.5) / 28 * P, col = i % 2 ? ORANGE : GOLD;
  for (let m = 0; m < 9; m++)
    pts.push({ x: 0.585 * Math.cos(a) + (rnd() - 0.5) * 0.06, y: 0.12 + (rnd() - 0.5) * 0.05, z: 0.585 * Math.sin(a) + (rnd() - 0.5) * 0.06, c: col, sh: 1, j: rnd(), k: 1, ch: 'O@o'[m % 3] });
}
for (let m = 0; m < 110; m++) {   // candle
  const a = rnd() * P, y = 0.3 + rnd() * 0.36;
  pts.push({ x: 0.03 * Math.cos(a), y, z: 0.03 * Math.sin(a), c: [245, 238, 220], sh: 1, j: rnd(), k: 1, ch: '|:'[m % 2] });
}
const STICKS = [0.5, 2.6, 4.7];
STICKS.forEach(a => {   // incense sticks
  for (let m = 0; m < 46; m++) {
    const f = m / 45, r = 0.07 + 0.17 * f;
    pts.push({ x: r * Math.cos(a), y: 0.26 + 0.52 * f, z: r * Math.sin(a), c: f > 0.93 ? [255, 90, 60] : [190, 130, 90], sh: 1, j: rnd(), k: f > 0.93 ? 4 : 1, ch: f > 0.93 ? '*' : '|' });
  }
});

// ---------- scene state ----------
const stars = Array.from({ length: 90 }, () => ({ x: rnd(), y: rnd() * 0.95, ph: rnd() * 6.283, ch: '.+*'[(rnd() * 3) | 0] }));
const lan = Array.from({ length: 5 }, () => ({ x: rnd(), y: rnd() * 1.05, v: 0.035 + rnd() * 0.05, ph: rnd() * 6.283 }));
const sparks = [];
let nextFw = 6, off = 0, drag = false, lastX = 0, sx = 0, sy = 0, moved = 0;
let X, Y, ZD, ca, sa, ct, st, bob, sw = 0, sc = 0, LZ = -4e5, REFL = true, B = 0, T = 0, curLabel = '';
function P3(x, y, z) {
  y += bob;
  const x1 = x * ca + z * sa, z1 = -x * sa + z * ca;
  ZD = y * st + z1 * ct;
  const pr = 1 / (1 - ZD * 0.3);
  X = W / 2 + sw + x1 * S * pr; Y = cy - (y * ct - z1 * st) * S * pr;
}
function burst(px, py) {
  const c0 = (px - ox) / cw, r0 = py / lh, col = [GOLD, PINK, CYAN, ORANGE, LILAC][(rnd() * 5) | 0];
  for (let i = 0; i < 44; i++) {
    const a = rnd() * 6.283, v = 4 + rnd() * 16;
    sparks.push({ x: c0, y: r0, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.55 - 2, life: 0.9 + rnd() * 1.1, ch: '*+♥.'[(rnd() * 4) | 0], col: rnd() > 0.3 ? col : WHITE });
  }
}
cv.addEventListener('pointerdown', e => { drag = true; lastX = sx = e.clientX; sy = e.clientY; moved = 0; });
addEventListener('pointerup', e => { if (drag && moved < 8) burst(e.clientX, e.clientY); drag = false; });
addEventListener('pointermove', e => { if (drag) { off += (e.clientX - lastX) * 0.012; lastX = e.clientX; moved = Math.max(moved, Math.hypot(e.clientX - sx, e.clientY - sy)); } });

function resize() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fs = Math.max(8, Math.min(14, W / 62));
  ctx.font = fs + 'px ' + MONO;
  cw = ctx.measureText('M').width; lh = fs;
  cols = Math.floor(W / cw); rows = Math.floor(H / lh);
  ox = (W - cols * cw) / 2; wr = Math.floor(rows * 0.5);
  S = Math.min(W * 0.68, H * 0.58); cy = H * 0.7;
  buf = { ch: new Array(cols * rows), col: new Array(cols * rows), z: new Float32Array(cols * rows), gl: new Uint8Array(cols * rows) };
}
function put(c, r, ch, col, z, g) {
  if (c < 0 || r < 0 || c >= cols || r >= rows) return;
  const i = r * cols + c;
  if (z > buf.z[i]) { buf.z[i] = z; buf.ch[i] = ch; buf.col[i] = col; buf.gl[i] = g ? 1 : 0; }
}
function txt(c, r, s, col, z, g) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') put(c + i, r, s[i], col, z, g); }
// ---------- scrolling riverbank scenery (the krathong drifts past it) ----------
const BANK = [70, 120, 135], FAR = [45, 78, 115], WOOD = [130, 98, 72], STUPA = [190, 150, 70];
const ITEMS = [
  { f: 0.03, k: 'palm' }, { f: 0.07, k: 'tree' }, { f: 0.12, k: 'wat', l: 'วัดริมน้ำ' }, { f: 0.2, k: 'tree' },
  { f: 0.27, k: 'houses', l: 'บ้านริมน้ำ' }, { f: 0.335, k: 'tree' }, { f: 0.41, k: 'pier', l: 'ท่าน้ำ' },
  { f: 0.48, k: 'sala', l: 'ศาลาริมน้ำ' }, { f: 0.55, k: 'palm' }, { f: 0.62, k: 'bridge', l: 'สะพานโค้ง' },
  { f: 0.70, k: 'tree' }, { f: 0.79, k: 'chedi', l: 'เจดีย์ทอง' }, { f: 0.85, k: 'tree' },
  { f: 0.9, k: 'houses', l: 'ชุมชนริมน้ำ' }, { f: 0.975, k: 'tree' }
];
const MIDC = [58, 100, 128], LEAF = [52, 105, 100];
const hsh = n => ((Math.imul(n | 0, 2654435761) >>> 0) % 1000) / 1000;
function tree(cx, h, col) {   // round-canopy tree
  for (let k = 0; k < h; k++) bput(cx, B - k, k % 3 === 2 ? ':' : '|', WOOD);
  const ty = B - h;
  fillRow(cx - 3, cx + 3, ty, 'o', col); fillRow(cx - 4, cx + 4, ty - 1, '@', col);
  fillRow(cx - 3, cx + 3, ty - 2, 'O', col); fillRow(cx - 1, cx + 1, ty - 3, 'o', col);
  bput(cx - 5, ty - 1, '(', col); bput(cx + 5, ty - 1, ')', col);
}
function sala(cx, col) {   // open-sided pavilion with hanging lanterns
  for (const s of [-5, -2, 2, 5]) for (let r = 0; r < 3; r++) bput(cx + s, B - r, '|', col);
  fillRow(cx - 6, cx + 6, B, '=', col); fillRow(cx - 5, cx + 5, B - 3, '-', col);
  roof(cx, B - 4, 7, col); bput(cx, B - 7, '^', GOLD, true);
  for (const q of [-4, 0, 4]) { bput(cx + q, B - 2, '*', GOLD, true); bput(cx + q, B - 3, '|', col); }
}
function lamp(cx) { for (let k = 1; k <= 4; k++) bput(cx, B - k, '|', WOOD); bput(cx - 1, B - 5, '-', WOOD); bput(cx, B - 5, '*', GOLD, true); bput(cx + 1, B - 5, '-', WOOD); }
function bput(c, r, ch, col, g) {
  put(c, r, ch, rgb(col), LZ, g);
  const k = B - r;
  if (REFL && k >= 0 && k <= 9 && Math.sin(c * 0.7 + k * 2 + T * 3) > -0.3)
    put(c + Math.round(Math.sin(k * 1.3 + T * 2) * 1.2), wr + k, ch === '*' ? ':' : ch, rgb(col, 0.28), -4.8e5);
}
const fillRow = (c0, c1, r, ch, col) => { for (let q = c0; q <= c1; q++) bput(q, r, ch, col); };
function chedi(cx, h, col) {
  for (let k = 0; k < h; k++) {
    const w = Math.max(0, Math.round(h * 0.4 * Math.pow(1 - k / h, 0.9))), r = B - k;
    if (!w) bput(cx, r, '|', col);
    else { bput(cx - w, r, '/', col); bput(cx + w, r, '\\', col); for (let q = -w + 1; q < w; q++) bput(cx + q, r, k % 3 === 1 ? '=' : '#', col); }
  }
  bput(cx, B - h, '*', GOLD, true);
}
function roof(cx, y, h, col) {
  for (let j = 0; j < 3; j++) {
    const hh = h - j;
    bput(cx - hh, y - j, '/', col); bput(cx + hh, y - j, '\\', col);
    for (let q = -hh + 1; q < hh; q++) bput(cx + q, y - j, '#', col);
  }
}
function wat(cx, w, col) {
  for (let r = 0; r < 3; r++) { bput(cx - w + 1, B - r, '|', col); bput(cx + w - 1, B - r, '|', col); }
  fillRow(cx - w + 2, cx + w - 2, B, '_', col);
  for (let q = -w + 3; q < w - 3; q += 3) { bput(cx + q, B - 1, '[', GOLD, true); bput(cx + q + 1, B - 1, ']', GOLD, true); }
  roof(cx, B - 3, w + 1, col); roof(cx, B - 5, w - 2, col);
  bput(cx, B - 8, '^', GOLD, true);
  chedi(cx + w + 6, 12, STUPA);
}
function house(cx, w, col) {
  for (let r = 0; r < 3; r++) { bput(cx - w, B - r, '|', col); bput(cx + w, B - r, '|', col); }
  fillRow(cx - w + 1, cx + w - 1, B, '_', col);
  bput(cx - 1, B - 1, '[', GOLD, true); bput(cx, B - 1, ']', GOLD, true);
  roof(cx, B - 3, w + 1, col);
  for (const s of [-w + 1, w - 1]) { bput(cx + s, wr, '|', WOOD); bput(cx + s, wr + 1, '|', WOOD); }
}
function pier(cx, col) {   // ท่าน้ำ: wooden pier + sala pavilion + lanterns
  fillRow(cx - 4, cx + 16, wr, '=', WOOD);
  for (let q = cx - 3; q <= cx + 16; q += 4) { bput(q, wr + 1, '|', WOOD); bput(q, wr + 2, '|', WOOD); bput(q, wr + 3, ':', WOOD); }
  for (const s of [-3, 3]) for (let r = 0; r < 3; r++) bput(cx + s, B - r, '|', col);
  fillRow(cx - 3, cx + 3, B, '_', col);
  roof(cx, B - 3, 5, col); bput(cx, B - 6, '^', GOLD, true);
  for (const q of [-2, 0, 2]) bput(cx + q, B - 2, '*', GOLD, true);
  for (let q = cx + 6; q <= cx + 16; q += 5) { bput(q, B, '|', WOOD); bput(q, B - 1, '*', GOLD, true); }
}
function bridge(cx, col) {
  const a = 9, deck = B - 4;
  fillRow(cx - 2 * a, cx + 2 * a, deck, '=', col);
  for (let q = -2 * a; q <= 2 * a; q += 3) bput(cx + q, deck - 1, '|', col);
  fillRow(cx - 2 * a, cx + 2 * a, deck - 2, '-', col);
  for (let q = -2 * a; q <= 2 * a; q += 6) bput(cx + q, deck - 3, '*', GOLD, true);
  for (const s of [-a, a]) for (let q = -a + 1; q < a; q++) bput(cx + s + q, B - Math.round(3 * (1 - (q / a) ** 2)), '-', col);
  for (const p of [-2 * a, 0, 2 * a]) {
    for (let r = B; r > deck; r--) bput(cx + p, r, '|', col);
    for (let r = wr; r < wr + 3; r++) bput(cx + p, r, '|', col);
  }
}
function palm(cx, h, col) {
  let tx = cx;
  for (let k = 0; k < h; k++) { tx = cx + Math.round(Math.sin(k * 0.3) * 1.5); bput(tx, B - k, '|', col); }
  const ty = B - h;
  bput(tx - 2, ty, '_', col); bput(tx - 1, ty - 1, '/', col); bput(tx, ty - 1, '^', col); bput(tx + 1, ty - 1, '\\', col); bput(tx + 2, ty, '_', col);
  bput(tx - 3, ty + 1, '/', col); bput(tx + 3, ty + 1, '\\', col); bput(tx - 4, ty + 2, '.', col); bput(tx + 4, ty + 2, '.', col);
}
function drawScenery(t) {
  T = t; B = wr - 1; REFL = false; LZ = -6e5; curLabel = '';
  const WORLD = Math.max(380, cols + 160), scF = sc * 0.3;
  for (let c = 0; c < cols; c++) {   // distant hills
    const h = Math.round(2 + 2 * Math.sin((c + scF) * 0.07) + 1.5 * Math.sin((c + scF) * 0.19 + 1));
    for (let k = 1; k <= h; k++) put(c, wr - k, k === h ? '^' : ':', rgb(FAR), -6e5);
  }
  for (let i = 0; i < 5; i++) {   // tiny far-away chedis
    const fx = ((i * 0.2 * WORLD - scF) % WORLD + WORLD) % WORLD - 10;
    if (fx > -8 && fx < cols + 8) chedi(Math.round(fx), 6, FAR);
  }
  LZ = -5.5e5; REFL = false;   // middle layer: tiny village + trees drifting slower than the main bank
  const WM = Math.max(300, cols + 100), scM = sc * 0.55;
  for (let i = 0; i < 16; i++) {
    const x = Math.round(((i * (WM / 16) + hsh(i * 7) * 10 - scM) % WM + WM) % WM - 12);
    if (x < -10 || x > cols + 10) continue;
    if (i % 3 === 1) { bput(x, B, '|', MIDC); fillRow(x - 1, x + 1, B - 1, 'o', LEAF); bput(x, B - 2, 'o', LEAF); }
    else {
      const w = 2 + (i % 3);
      fillRow(x - w, x + w, B, '_', MIDC); bput(x - w, B - 1, '|', MIDC); bput(x + w, B - 1, '|', MIDC);
      bput(x - w - 1, B - 2, '/', MIDC); bput(x + w + 1, B - 2, '\\', MIDC); fillRow(x - w, x + w, B - 2, '#', MIDC);
      if (i % 3 === 2) bput(x, B - 1, ']', GOLD);
    }
  }
